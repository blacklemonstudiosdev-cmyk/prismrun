<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Prism Run</title>
<meta name="theme-color" content="#05060f">
<meta name="description" content="PRISM RUN — an endless 3D voxel tunnel runner.">
<link rel="icon" href="assets/icon.png">
<link rel="preload" href="assets/fonts/8bit-wonder.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles/main.css">

<div id="stage"></div>
<div id="hud"></div>

<!-- Three.js is ESM-only and its addons import the bare specifier "three", so
     the specifier has to be mapped to the vendored build. The map must come
     before any module that uses it. Nothing here reaches off-device: every
     target is a file inside the project. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="src/main.js"></script>
